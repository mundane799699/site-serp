<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Google 收录导出 - 设置</title>
  <style>
    body { width: 300px; margin: 0; padding: 14px 16px; font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #202124; background: #fff; }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0 0 12px; }
    h1 img { width: 20px; height: 20px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
    .row label { flex: 1; }
    .row input[type=number] { width: 64px; padding: 3px 6px; border: 1px solid #dadce0; border-radius: 6px; font-size: 13px; }
    .range { display: flex; align-items: center; gap: 4px; }
    .hint { color: #5f6368; font-size: 12px; margin: -6px 0 10px; }
    .btns { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid #dadce0; background: #fff; color: #1a73e8; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    #status { min-height: 18px; margin-top: 8px; font-size: 12px; color: #188038; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">Google 收录导出 · 设置</h1>

  <div class="row">
    <label>翻页间隔（秒）</label>
    <span class="range">
      <input type="number" id="delayMin" min="1" max="120" step="1"> ~
      <input type="number" id="delayMax" min="1" max="300" step="1">
    </span>
  </div>
  <div class="hint">每翻一页随机等待这个区间内的秒数，间隔越长越不容易触发人机验证</div>

  <div class="row">
    <label for="maxPages">最多翻几页</label>
    <input type="number" id="maxPages" min="1" max="100" step="1">
  </div>
  <div class="hint">每页约 10 条，Google 一般最多给到 30~40 页左右</div>

  <div class="row">
    <label for="includeOmitted">包含 Google 省略的相似结果</label>
    <input type="checkbox" id="includeOmitted">
  </div>
  <div class="hint">开启后翻页会带上 filter=0，能多抓到一些重复度高的页面</div>

  <div class="btns">
    <button id="reset">恢复默认</button>
    <button id="save" class="primary">保存</button>
  </div>
  <div id="status"></div>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
